name: Pure Writer desktop artifacts

# Builds the platform jars that Pure Writer desktop ships: one macOS jar per architecture (x86_64 and arm64, each
# with a single-architecture dylib; CMake names the platform "Mac" either way) and a Windows x64 jar built with
# MinGW-w64. All of them are shipped with one Java jar, the one built for macOS arm64, and every platform jar is smoke
# tested together with it (.github/purewriter/smoke.py): compress a multi-member archive with level 5, a 1 MiB
# dictionary and solid mode off, extract it again byte for byte, and check the format with py7zr. The arm64 jar runs
# with an arm64 JVM, the x86_64 jar with an x86_64 JVM under Rosetta 2.
#
# Runs on pushes to the purewriter-* release branches and pw-* tags, or manually. Read-only token, no secrets;
# actions are pinned to commit SHAs.
on:
  workflow_dispatch:
  push:
    branches: ['purewriter-*']
    tags: ['pw-*']

permissions:
  contents: read

jobs:
  mac:
    name: macOS x86_64 and arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # CMake 3.x: the project still sets policies that CMake 4 no longer supports.
      - name: Install CMake and py7zr
        run: python -m pip install cmake==3.28.4 py7zr==1.0.0

      - name: Install Rosetta 2 (x86_64 smoke test)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up x86_64 JDK 17 (smoke test under Rosetta)
        id: jdk-x64
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      # Build with JDK 8 like upstream: CMake looks for 'javah' in /usr/bin as well, and the macOS stub there only
      # works when a JDK 8 is installed. With JDK 8 in JAVA_JDK, its own javah is found first.
      - name: Set up arm64 JDK 8 (build)
        id: jdk8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64

      - name: Set up arm64 JDK 17
        id: jdk-arm64
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64

      - name: Build one dylib and platform jar per architecture
        env:
          JDK: ${{ steps.jdk8.outputs.path }}
        run: |
          set -eux
          cmake --version | head -1
          clang --version | head -1
          for arch in x86_64 arm64; do
            # CMAKE_OSX_ARCHITECTURES: on an Apple silicon host CMake otherwise adds "-arch arm64" on its own, and the
            # x86_64 build comes out as a universal dylib.
            cmake -S . -B "build-$arch" -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=FALSE -DBUILD_TESTING=OFF \
              -DJAVA_SYSTEM=Mac -DJAVA_ARCH="$arch" -DCMAKE_OSX_ARCHITECTURES="$arch" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
              -DJAVA_JDK="$JDK"
            cmake --build "build-$arch" --parallel 3
            test "$(lipo -archs "build-$arch/jbinding-cpp/lib7-Zip-JBinding.dylib")" = "$arch"
            vtool -show-build "build-$arch/jbinding-cpp/lib7-Zip-JBinding.dylib"
            unzip -l "build-$arch/sevenzipjbinding-Mac.jar"
          done

      - name: Smoke test, arm64 with arm64 JVM and x86_64 with x86_64 JVM
        env:
          JDK_ARM64: ${{ steps.jdk-arm64.outputs.path }}
          JDK_X64: ${{ steps.jdk-x64.outputs.path }}
        run: |
          set -eux
          java_jar=build-arm64/jbinding-java/sevenzipjbinding.jar
          mkdir -p smoke/classes
          "$JDK_ARM64/bin/javac" --release 8 -cp "$java_jar" -d smoke/classes .github/purewriter/PureWriterSmoke.java
          python .github/purewriter/smoke.py --java "$JDK_ARM64/bin/java" \
            --classpath "smoke/classes:$java_jar:build-arm64/sevenzipjbinding-Mac.jar" \
            --work smoke/arm64 --expect-arch aarch64 --report smoke/mac-arm64.json
          python .github/purewriter/smoke.py --java "$JDK_X64/bin/java" \
            --classpath "smoke/classes:$java_jar:build-x86_64/sevenzipjbinding-Mac.jar" \
            --work smoke/x86_64 --expect-arch x86_64 --report smoke/mac-x86_64.json

      - name: Collect artifacts
        run: |
          set -eux
          for arch in x86_64 arm64; do
            mkdir -p "dist/$arch"
            cp build-arm64/jbinding-java/sevenzipjbinding.jar "build-$arch/sevenzipjbinding-Mac.jar" "dist/$arch/"
            (cd "dist/$arch" && shasum -a 256 *.jar > SHA256SUMS && cat SHA256SUMS)
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-x86_64
          path: dist/x86_64/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-arm64
          path: dist/arm64/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-mac
          path: smoke/*.json
          if-no-files-found: error

  windows:
    name: Windows x64 (MinGW-w64)
    # Needs the Java jar of the macOS arm64 build: the Windows jar is smoke tested and shipped with the same one.
    needs: mac
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CMake and py7zr
        run: python -m pip install cmake==3.28.4 py7zr==1.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Set up MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Build DLL and jars
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -eux
          export PATH="$(cygpath -u "$MSYS2_LOCATION")/mingw64/bin:$PATH"
          cmake --version | head -1
          gcc --version | head -1
          # -fno-devirtualize-speculatively: GCC's speculative devirtualization compares vtable pointers with the
          # vtables of 7-Zip classes whose methods are not linked into the library (COpenCallbackImp,
          # CArchiveExtractCallback from the 7-Zip UI headers), which fails to link with "undefined reference to
          # vtable".
          # -static: STATIC_BUILD only links libgcc and libstdc++ statically; libwinpthread would stay a DLL.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DMINGW64=Yes \
            -DJAVA_SYSTEM=Windows -DJAVA_ARCH=amd64 -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS=-fno-devirtualize-speculatively -DCMAKE_SHARED_LINKER_FLAGS=-static \
            -DJAVA_JDK="$JAVA_HOME"
          cmake --build build --parallel 4
          objdump -p build/jbinding-cpp/lib7-Zip-JBinding.dll | grep "DLL Name" | tee build/dll-imports.txt
          # The DLL must not need the MinGW runtime DLLs: users do not have them.
          if grep -qiE "libgcc|libstdc|libwinpthread" build/dll-imports.txt; then exit 1; fi
          unzip -l build/sevenzipjbinding-Windows-amd64.jar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: mac-arm64

      - name: Smoke test
        run: |
          set -eux
          (cd mac-arm64 && sha256sum -c SHA256SUMS)
          mkdir -p smoke/classes
          "$JAVA_HOME/bin/javac" --release 8 -cp mac-arm64/sevenzipjbinding.jar -d smoke/classes \
            .github/purewriter/PureWriterSmoke.java
          classpath="smoke/classes;mac-arm64/sevenzipjbinding.jar;build/sevenzipjbinding-Windows-amd64.jar"
          python .github/purewriter/smoke.py --java "$JAVA_HOME/bin/java" --classpath "$classpath" \
            --work smoke/windows --expect-arch amd64 --report smoke/windows-amd64.json

      - name: Collect artifacts
        run: |
          set -eux
          mkdir dist
          cp mac-arm64/sevenzipjbinding.jar build/sevenzipjbinding-Windows-amd64.jar dist/
          cd dist
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-amd64
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-windows
          path: smoke/*.json
          if-no-files-found: error
